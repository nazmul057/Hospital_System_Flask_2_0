{% extends "layout.html" %}

{% block jumbotronUp %}
    <h1>
        Doctors
    </h1>
{% endblock jumbotronUp%}

{% block content %}
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('patient.allDoctors') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               role="button"
               aria-pressed="true">My Doctors</a>
        </div>
    </div>
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('patient.searchDoctor') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               role="button"
               aria-pressed="true">Search Doctors</a>
        </div>
    </div>
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('patient.disconnectDoctor') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               role="button"
               aria-pressed="true">Disconnect Doctor</a>
        </div>
    </div>
{% endblock content %}
