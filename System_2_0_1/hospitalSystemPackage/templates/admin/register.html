{% extends "layout.html" %}

{% block jumbotronUp %}
    <h1>
        Register User
    </h1>
{% endblock jumbotronUp%}

{% block content %}
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('admin.registerPatient') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               role="button"
               aria-pressed="true">Register Patient</a>
        </div>
    </div>
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('admin.registerHospitalStaff') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               role="button"
               aria-pressed="true">Register Hospital Staff</a>
        </div>
    </div>
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('admin.registerDoctor') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               role="button"
               aria-pressed="true">Register Doctor</a>
        </div>
    </div>
    <div class="row">
        <div class="col-3" style="margin-bottom: 10px;">
            <a href="{{ url_for('admin.registerAdmin') }}"
               class="btn btn-outline-info hoverEffect container-fluid"
               style="margin-bottom : 10px;">Register Admin</a>
        </div>
    </div>

{% endblock content %}
